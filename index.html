<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 Web3 Lottery dApp & Admin Panel</title>
    <!-- Web3 Cüzdan bağlantıları için Ethers.js Kütüphanesi -->
    <script src="https://cloudflare.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0e14; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e2530; padding-bottom: 15px; max-width: 900px; margin: 0 auto; }
        .connect-btn { background-color: #e0b034; color: #000; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
        main { text-align: center; marginTop: 40px; max-width: 900px; margin: 40px auto 0 auto; }
        .status-text { color: #888; text-transform: uppercase; fontSize: 0.8rem; letter-spacing: 1px; }
        .balance-text { color: #e0b034; font-size: 3.5rem; margin: 10px 0; font-weight: bold; }
        .info-bar { color: #00ff66; font-weight: bold; margin-bottom: 20px; font-size: 1.1rem; }
        .buy-box { margin: 20px auto; max-width: 320px; background: '#131924'; padding: 15px; border-radius: 8px; border: 1px solid #1e2530; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .buy-box input { width: 70px; padding: 10px; background: #0b0e14; border: 1px solid #333; color: #fff; text-align: center; font-size: 1rem; border-radius: 4px; }
        .buy-btn { background-color: #00ff66; color: #000; border: none; padding: 10px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        .matrix-container { display: grid; grid-template-columns: repeat(9, 1fr); gap: 10px; max-width: 550px; margin: 30px auto; background: #131924; padding: 20px; border-radius: 10px; border: 1px solid #1e2530; }
        .ball { background: #252f41; border-radius: 50%; width: 40px; height: 40px; display: flex; items-center: center; justify-content: center; align-items: center; font-size: 0.9rem; font-weight: bold; color: #fff; margin: auto; transition: 0.3s; }
        .ball:hover { background: #e0b034; color: #000; cursor: pointer; }
        admin-section { display: block; margin-top: 60px; border-top: 2px solid #1e2530; padding-top: 40px; max-width: 900px; margin-left: auto; margin-right: auto; }
        .admin-title { color: #ff3366; margin-bottom: 25px; text-align: center; font-size: 1.6rem; }
        .admin-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media(min-width: 600px) { .admin-grid { grid-template-columns: 1fr 1fr; } }
        .admin-card { background: #11151d; padding: 25px; border-radius: 8px; border: 1px solid #222; }
        .admin-card h4 { color: #00ff66; margin-bottom: 15px; font-size: 1.1rem; border-bottom: 1px solid #222; padding-bottom: 5px; }
        .admin-card.token-card h4 { color: #e0b034; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 10px; background: #1a202c; border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 0.9rem; }
        .admin-btn { width: 100%; padding: 12px; background: #00ff66; color: #000; font-weight: bold; border: none; cursor: pointer; border-radius: 4px; font-size: 1rem; margin-top: 10px; transition: 0.2s; }
        .admin-btn.token-btn { background: #e0b034; }
    </style>
</head>
<body>

    <!-- ÜST BAR / CÜZDAN BAĞLAMA -->
    <header>
        <h2>🔮 LOTTERY dAPP</h2>
        <button id="connectBtn" class="connect-btn" onclick="connectWallet()">Cüzdanı Bağla</button>
    </header>

    <!-- KULLANICI PİYANGO EKRANI -->
    <main>
        <p class="status-text">Çekiliş Hazırlanıyor...</p>
        <h1 class="balance-text">$1,280.70</h1>
        <div id="infoBar" class="info-bar">Tur: #1 | Bilet Fiyatı: 5 TOKN</div>

        <!-- Bilet Satın Alma Kutusu -->
        <div class="buy-box">
            <input type="number" id="ticketCount" value="1" min="1">
            <button class="buy-btn" onclick="buyTickets()">Bilet Satın Al</button>
        </div>

        <!-- 1-75 Arası Şans Topları Matrisi -->
        <div class="matrix-container" id="matrixContainer"></div>
    </main>

    <!-- YÖNETİM & TEST PANELİ -->
    <admin-section>
        <h2 class="admin-title">⚙️ Admin Yönetim & Test Paneli</h2>
        <div class="admin-grid">
            
            <!-- Sol Kart: Oyun Ayarları -->
            <div class="admin-card">
                <h4>Oyun Parametreleri</h4>
                <div class="form-group">
                    <label>Bilet Fiyatı (TOKN)</label>
                    <input type="number" id="newPrice" value="5">
                </div>
                <div class="form-group">
                    <label>Tur Süresi (Döngü/Gün)</label>
                    <input type="number" id="newDuration" value="182">
                </div>
                <div class="form-group">
                    <label>Komisyon Oranı (%)</label>
                    <input type="number" id="newCommission" value="8">
                </div>
                <button class="admin-btn" onclick="updateSettings()">Ayarları Kaydet</button>
            </div>

            <!-- Sağ Kart: Test Token Dağıtımı -->
            <div class="admin-card token-card">
                <h4>Kendine/Başkasına Deneme Tokeni Ekle</h4>
                <div class="form-group">
                    <label>Hedef Cüzdan Adresi (0x...)</label>
                    <input type="text" id="targetAddress" placeholder="0x...">
                </div>
                <div class="form-group">
                    <label>Gönderilecek Miktar (TOKN)</label>
                    <input type="number" id="tokenAmount" placeholder="Örn: 1000">
                </div>
                <button class="admin-btn token-btn" onclick="giveTestTokens()">Test Tokeni Gönder</button>
            </div>

        </div>
    </admin-section>

    <script>
        // Web3 Akıllı Sözleşme Ayarları
        const CONTRACT_ADDRESS = "0xSözleşmeAdresiniz";
        const LOTTERY_ABI = [
            "function buyTickets(uint256 _count) external",
            "function updateSettings(uint256 _price, uint256 _duration, uint256 _commission) external",
            "function giveTestTokens(address _to, uint256 _amount) external",
            "function ticketPrice() external view returns (uint256)",
            "function currentRound() external view returns (uint256)"
        ];

        let walletAccount = null;
        let lotteryContract = null;

        // 1-75 Arası Sayı Toplarını Ekrana Basma Dinamiği
        const matrixContainer = document.getElementById('matrixContainer');
        for (let i = 1; i <= 75; i++) {
            const ball = document.createElement('div');
            ball.className = 'ball';
            ball.innerText = i;
            matrixContainer.appendChild(ball);
        }

        // Cüzdan Bağlama Fonksiyonu
        async function connectWallet() {
            if (window.ethereum) {
                try {
                    const provider = new ethers.BrowserProvider(window.ethereum);
                    const accounts = await provider.send("eth_requestAccounts", []);
                    const signer = await provider.getSigner();
                    
                    walletAccount = accounts[0];
                    lotteryContract = new ethers.Contract(CONTRACT_ADDRESS, LOTTERY_ABI, signer);
                    
                    document.getElementById('connectBtn').innerText = walletAccount.substring(0,6) + "..." + walletAccount.substring(38);
                    fetchContractData();
                } catch (err) {
                    console.error("Cüzdan bağlama hatası:", err);
                }
            } else {
                alert("Lütfen MetaMask veya uyumlu bir Web3 cüzdanı kullanın.");
            }
        }

        // Kontrattan Canlı Veri Okuma
        async function fetchContractData() {
            if (!lotteryContract) return;
            try {
                const round = await lotteryContract.currentRound();
                const price = await lotteryContract.ticketPrice();
                document.getElementById('infoBar').innerText = `Tur: #${round.toString()} | Bilet Fiyatı: ${ethers.formatEther(price)} TOKN`;
            } catch (err) {
                console.error("Veri çekme hatası:", err);
            }
        }

        // Kullanıcı: Bilet Satın Al
        async function buyTickets() {
            if (!lotteryContract) return alert("Önce cüzdanınızı bağlayın!");
            const count = document.getElementById('ticketCount').value;
            try {
                const tx = await lotteryContract.buyTickets(count);
                await tx.wait();
                alert("Bilet alımı başarılı!");
                fetchContractData();
            } catch (err) {
                console.error(err);
                alert("İşlem başarısız.");
            }
        }

        // Admin: Ayarları Güncelle
        async function updateSettings() {
            if (!lotteryContract) return alert("Önce cüzdanınızı bağlayın!");
            const price = document.getElementById('newPrice').value;
            const duration = document.getElementById('newDuration').value;
            const commission = document.getElementById('newCommission').value;
            try {
                const parsedPrice = ethers.parseEther(price.toString());
                const tx = await lotteryContract.updateSettings(parsedPrice, duration, commission);
                await tx.wait();
                alert("Oyun ayarları güncellendi!");
                fetchContractData();
